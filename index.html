<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch & Timer</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.cdnfonts.com/css/digital-numbers" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="nav">
            <button class="nav-btn active" data-index="0">STOPWATCH</button>
            <Button class="nav-btn" data-index="1">TIMER</Button>
        </div>
        
        <div class="slider">
            <div id="Stopwatch" class="screen">
                <div id="st-timeDisplay"></div>
                <div class="laps"></div>
                <div id="st-buttons">
                    <button id="st-reset" class="other-btns">Reset</button>
                    <button id="st-toggle" class="start-btns">Start</button>
                    <button id="st-lapBtn" class="other-btns">Lap</button>
                </div>
            </div>
            <div id="timer" class="screen">
                <h3></h3>
                <div id="timer-timeDisplay">
                    <input type="number" id="hour" value="00">:<input type="number" id="min" value="00">:<input type="number" id="sec" value="00">
                </div>
                <div id="timer-buttons">
                    <button id="timer-toggle" class="start-btns">Start</button>
                    <button id="timer-reset" class="other-btns">Reset</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js" defer></script>
</body>
</html>
