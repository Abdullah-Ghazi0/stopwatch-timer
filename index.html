<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="slider">
            <div id="Stopwatch" class="screen">
                <h3>Stop Watch</h3>
                <div id="st-timeDisplay"></div>
                <div id="st-buttons">
                    <button id="st-toggle">Start</button>
                    <button id="st-reset">Reset</button>
                    <button id="st-lapBtn">Lap</button>
                </div>
                <div class="laps"></div>
            </div>
            <br>
            <div id="timer" class="screen">
                <h3>Timer</h3>
                <div id="timer-timeDisplay">
                    <input type="number" id="hour" value="00">:
                    <input type="number" id="min" value="00">:
                    <input type="number" id="sec" value="00">
                </div>
                <div id="timer-buttons">
                    <button id="timer-toggle">Start</button>
                    <button id="timer-reset">Reset</button>
                </div>
            </div>
        </div>
    </div>
    

    
    <script src="script.js" defer></script>
</body>
</html>
