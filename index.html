<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Stop Watch & Timer</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="icon" type="image/x-icon" href="static/favicon.ico" />
    </head>
    <body>
        <div class="container">
            <nav class="nav">
                <button class="nav-btn active" data-index="0">STOPWATCH</button>
                <button class="nav-btn" data-index="1">TIMER</button>
            </nav>

            <div class="slider">
                <section id="Stopwatch" class="screen">
                    <div id="st-timeDisplay"></div>
                    <div class="laps"></div>
                    <div id="st-buttons">
                        <button id="st-reset" class="other-btns">Reset</button>
                        <button id="st-toggle" class="start-btns">Start</button>
                        <button id="st-lapBtn" class="other-btns">Lap</button>
                    </div>
                </section>
                <section id="timer" class="screen">
                    <div id="timer-timeDisplay">
                        <input type="number" id="hour" value="00" />:<input
                            type="number"
                            id="min"
                            value="00"
                        />:<input type="number" id="sec" value="00" />
                    </div>
                    <div id="timer-buttons">
                        <button id="timer-toggle" class="start-btns">
                            Start
                        </button>
                        <button id="timer-reset" class="other-btns">
                            Reset
                        </button>
                    </div>
                </section>
            </div>
        </div>

        <script src="script.js" defer></script>
    </body>
</html>
